[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-directional-trading"
version = "0.1.1"
description = "Research and paper-trading infrastructure for directional crypto strategies"
requires-python = ">=3.11"
dependencies = ["websockets>=13,<16", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Keep CI linting explicit and stable across Ruff releases.
[tool.ruff.lint]
select = ["E", "F", "I"]
